viewer:
  theme: dracula
  mode: scroll

panel:
  scrolling:
    horizontal:
      step: 4
  width:
    leftPercent: 50
    rightPercent: 50

input:
  escTimeout: 300ms
  mouse:
    doubleClickTimeout: 300ms

kubernetes:
  clusters:
    ttl: 2m
  discovery:
    refresh: 30s

resources:
  # Default behavior: hide resources with zero objects
  showNonEmptyOnly: true
  # How often to re-peek hidden resources for changes when showNonEmptyOnly is true
  peekInterval: 10s
  # Default ordering: alphabetic by resource plural
  order: alpha
  # Favorites are used when order=favorites; leave empty to follow discovery's "all" category.
  favorites: []

objects:
  # Object list ordering: name | -name | creation | -creation
  order: name
  # Columns mode for server-side Tables:
  # - normal: show priority 0 columns (kubectl default)
  # - wide: show all server-provided columns (like `kubectl get -o wide`)
  columns: normal

commands:
  - name: Top Nodes
    command: kubectl top nodes
    type: global
    location: panel
    watchInterval: 5s
    debounce: 500ms
    onExit: keep-open
  - name: Shell ($SHELL)
    command: $SHELL
    type: global
    location: panel
    interactive: true
    onExit: restore
  - name: Top Pods
    command: kubectl top pods -n {{.Namespace}}
    type: namespace
    location: panel
    debounce: 500ms
    onExit: keep-open
