version: 2

project_name: kc

builds:
  - id: kc
    main: ./cmd/kc
    binary: kc
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}

archives:
  - id: kc
    wrap_in_directory: false
    name_template: '{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}'
    files:
      - LICENSE
      - README.md

checksum:
  name_template: '{{ .ProjectName }}_checksums.txt'
  algorithm: sha256

signs:
  - id: archive-signatures
    cmd: gpg
    args:
      - --batch
      - --pinentry-mode
      - loopback
      - --passphrase-file
      - '{{ .Env.GPG_PASSPHRASE_FILE }}'
      - --armor
      - --detach-sign
      - --output
      - '${signature}'
      - '${artifact}'
    signature: '${artifact}.asc'
    artifacts: archive
  - id: checksum-signatures
    cmd: gpg
    args:
      - --batch
      - --pinentry-mode
      - loopback
      - --passphrase-file
      - '{{ .Env.GPG_PASSPHRASE_FILE }}'
      - --armor
      - --detach-sign
      - --output
      - '${signature}'
      - '${artifact}'
    signature: '${artifact}.asc'
    artifacts: checksum

release:
  github:
    owner: sttts
    name: kc
  prerelease: auto

changelog:
  use: git

brews:
  - name: kc
    repository:
      owner: sttts
      name: homebrew-kc
      branch: main
    directory: Formula
    homepage: https://github.com/sttts/kc
    description: Two-panel Kubernetes TUI built entirely with AI
    license: Apache-2.0
    commit_author:
      name: kc release bot
      email: noreply@sttts.dev
    test: |
      system "#{bin}/kc --version"

homebrew_casks:
  - name: kc
    ids: [kc]
    homepage: https://github.com/sttts/kc
    description: Two-panel Kubernetes TUI built entirely with AI
    license: Apache-2.0
    directory: Casks
    repository:
      owner: sttts
      name: homebrew-kc
      branch: main
    commit_author:
      name: kc release bot
      email: noreply@sttts.dev
    binaries:
      - kc

notarize:
  macos:
    - enabled: '{{ and (isEnvSet "MACOS_SIGN_P12") (isEnvSet "MACOS_NOTARY_KEY") }}'
      ids: [kc]
      sign:
        certificate: "{{ .Env.MACOS_SIGN_P12 }}"
        password: "{{ .Env.MACOS_SIGN_PASSWORD }}"
      notarize:
        issuer_id: "{{ .Env.MACOS_NOTARY_ISSUER_ID }}"
        key_id: "{{ .Env.MACOS_NOTARY_KEY_ID }}"
        key: "{{ .Env.MACOS_NOTARY_KEY }}"
        wait: true
        timeout: 30m
