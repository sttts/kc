name: Build binaries

on:
  push:
    branches:
      - '**'
  pull_request:

jobs:
  build:
    name: ${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Download dependencies
        run: go mod download

      - name: Run tests
        run: go test ./...

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          mkdir -p dist
          go build -trimpath -o "dist/kc-${GOOS}-${GOARCH}" ./cmd/kc

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kc-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/kc-${{ matrix.goos }}-${{ matrix.goarch }}
          if-no-files-found: error
